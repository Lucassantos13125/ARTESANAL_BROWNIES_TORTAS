<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Carrinho — Artesanal Brownies & Tortas</title>

    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>

  <body>

    <!-- ==============================
         CABEÇALHO
    =============================== -->
    <header class="site-header">
      <div class="container header-inner">

        <!-- LOGO -->
        <a
          href="index.html"
          class="brand"
        >
          <img
            src="images/logo.png"
            class="logo"
            alt="Artesanal Brownies & Tortas"
          />
        </a>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav
          class="nav"
          id="nav"
        >
          <a href="index.html">
            Início
          </a>

          <a href="cardapio.html">
            Cardápio
          </a>

          <a href="brownies.html">
            Brownies
          </a>

          <a href="tortas.html">
            Tortas
          </a>
        </nav>

        <!-- CARRINHO -->
        <a
          href="carrinho.html"
          class="cart-icon"
          aria-label="Abrir carrinho"
        >
          🛒
          <span id="cart-count">0</span>
        </a>

        <!-- MENU MOBILE -->
        <button
          class="hamburger"
          id="hamburger"
          type="button"
          aria-label="Abrir menu"
        >
          ☰
        </button>

      </div>
    </header>

    <!-- ==============================
         CONTEÚDO PRINCIPAL
    =============================== -->
    <main class="container page">

      <!-- TÍTULO DA PÁGINA -->
      <section class="page-head">

        <span class="eyebrow">
          SEU PEDIDO
        </span>

        <h1>
          Carrinho
        </h1>

        <p>
          Confira os itens, ajuste as quantidades e envie seu pedido.
        </p>

      </section>

      <!-- ==============================
           ÁREA DO CARRINHO
      =============================== -->
      <section class="cart-layout">

        <!-- ITENS DO CARRINHO -->
        <div class="cart-box">

          <div id="cart-items">
            <!--
              Os produtos serão inseridos
              aqui pelo JavaScript.
            -->
          </div>

        </div>

        <!-- ==============================
             RESUMO / CHECKOUT
        =============================== -->
        <aside class="checkout-box">

          <h2>
            Resumo
          </h2>

          <!-- SUBTOTAL -->
          <div class="summary-row">

            <span>
              Subtotal
            </span>

            <strong id="cart-subtotal">
              R$ 0,00
            </strong>

          </div>

          <!-- TOTAL -->
          <div class="summary-row total">

            <span>
              Total
            </span>

            <strong id="cart-total">
              R$ 0,00
            </strong>

          </div>

          <!-- NOME DO CLIENTE -->
          <div class="form-group">

            <label for="customer-name">
              Nome *
            </label>

            <input
              id="customer-name"
              type="text"
              placeholder="Como podemos te chamar?"
            />

          </div>
          
          <!-- OBSERVAÇÃO -->
          <div class="form-group">

            <label for="customer-note">
              Observação
            </label>

            <textarea
              id="customer-note"
              rows="3"
              placeholder="Alguma observação sobre o pedido?"
            ></textarea>

          </div>

          <!-- FINALIZAR PEDIDO -->
          <button
            class="btn btn-primary full"
            id="checkout"
            type="button"
          >
            Finalizar pelo WhatsApp
          </button>

          <!-- LIMPAR CARRINHO -->
          <button
            class="btn btn-danger full"
            id="clear-cart"
            type="button"
          >
            Limpar carrinho
          </button>

          <!-- CONTINUAR COMPRANDO -->
          <a
            class="continue"
            href="cardapio.html"
          >
            ← Continuar comprando
          </a>

        </aside>

      </section>

    </main>

    <!-- ==============================
         RODAPÉ
    =============================== -->
    <footer class="site-footer">

      <div class="container footer-inner">

        <div>
          <strong>
            ARTESANAL
          </strong>

          <span>
            BROWNIES & TORTAS
          </span>
        </div>

        <p>
          ©
          <span id="year"></span>
          Artesanal Brownies & Tortas
        </p>

        <a href="index.html">
          Início
        </a>

      </div>

    </footer>

    <!-- ==============================
         NOTIFICAÇÃO
    =============================== -->
    <div
      id="toast"
      class="toast"
      aria-live="polite"
    ></div>

    <!-- ==============================
         JAVASCRIPT
    =============================== -->
    <script src="produtos.js"></script>
    <script src="script.js"></script>

  </body>
</html>
```
